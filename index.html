<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Money Log</title>

  <style>
    :root {
      --bg: #f5f7f8;
      --card: #ffffff;
      --text: #1f2933;
      --sub: #6b7280;
      --border: #d9dee3;
      --green: #0f9d58;
      --red: #d93025;
      --blue: #1a73e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px 16px 96px;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .meta {
      color: var(--sub);
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      padding: 18px;
      background: var(--card);
      border: 1px solid #e6e5e3;
      border-radius: 16px;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.05),
        0 4px 12px rgba(0, 0, 0, 0.04);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .status {
      display: none;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.info {
      color: var(--blue);
      background: #e5f2fc;
    }

    .status.success {
      color: #267a4c;
      background: #e8f1ec;
    }

    .status.error {
      color: var(--red);
      background: #fce9e7;
    }

    .loading {
      padding: 24px;
      color: var(--sub);
      text-align: center;
    }

    .field-label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .choice-scroll {
      overflow-x: auto;
      padding: 2px 2px 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .choice-scroll::-webkit-scrollbar {
      display: none;
    }

    .choice-tabs {
      display: flex;
      gap: 8px;
      width: max-content;
      min-width: 100%;
    }

    .choice-button {
      flex: none;
      min-height: 44px;
      padding: 10px 15px;
      color: var(--sub);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }

    .choice-button.active {
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #16a34a,
          #22c55e 50%,
          #14b8a6
        );
      border-color: transparent;
      box-shadow:
        0 7px 16px rgba(34, 197, 94, 0.24);
    }

    .empty-options {
      padding: 12px;
      color: var(--sub);
      border: 1px dashed var(--border);
      border-radius: 12px;
      font-size: 13px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px 12px;
      color: var(--text);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      font-size: 18px;
    }

    input:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow:
        0 0 0 3px rgba(15, 157, 88, 0.14);
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .amount-box {
      position: relative;
    }

    .yen {
      position: absolute;
      top: 50%;
      left: 14px;
      color: var(--sub);
      transform: translateY(-50%);
    }

    #amount {
      padding-left: 36px;
      font-weight: 800;
    }

    .submit {
      width: 100%;
      min-height: 56px;
      margin-top: 20px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #16a34a,
          #22c55e 45%,
          #14b8a6
        );
      border: 0;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 14px 28px rgba(34, 197, 94, 0.25);
    }

    .submit:disabled {
      opacity: 0.6;
    }

    .last {
      display: none;
      margin-top: 12px;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.6;
    }

    .last.show {
      display: block;
    }

    .summary-list {
      display: grid;
      gap: 12px;
    }

    .summary-item {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .summary-label {
      color: var(--sub);
      font-size: 14px;
      font-weight: 800;
    }

    .summary-right {
      text-align: right;
    }

    .summary-budget {
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
    }

    .summary-balance {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 900;
    }

    .summary-balance.plus {
      color: var(--blue);
    }

    .summary-balance.minus {
      color: var(--red);
    }

    .summary-value {
      font-size: 34px;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    .tabs {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));
      background: rgba(245, 247, 248, 0.94);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .tab-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto;
      padding: 5px;
      background: #e9edf2;
      border-radius: 16px;
    }

    .tab-button {
      min-height: 44px;
      color: var(--sub);
      background: transparent;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab-button.active {
      color: var(--text);
      background: #ffffff;
      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.08);
    }

    @media (max-width: 520px) {
      body {
        padding:
          12px
          12px
          calc(92px + env(safe-area-inset-bottom));
      }

      h1 {
        font-size: 28px;
      }

      .card {
        padding: 16px;
      }

      input,
      textarea {
        font-size: 16px;
      }

      .summary-value {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <h1>Money Log</h1>

      <div class="meta">
        <div>
          Date:
          <span id="todayText">Loading...</span>
        </div>

        <div>
          Sheet:
          <span id="sheetName">Loading...</span>
        </div>
      </div>
    </header>

    <section
      id="inputScreen"
      class="screen active"
    >
      <div class="card">
        <h2 class="section-title">
          Log Entry
        </h2>

        <div
          id="status"
          class="status"
        ></div>

        <div
          id="loading"
          class="loading"
        >
          Loading...
        </div>

        <form
          id="form"
          style="display:none"
        >
          <div class="field-label">
            Category
          </div>

          <div class="choice-scroll">
            <div
              id="categoryTabs"
              class="choice-tabs"
            ></div>
          </div>

          <div class="field-label">
            Item
          </div>

          <div class="choice-scroll">
            <div
              id="itemTabs"
              class="choice-tabs"
            ></div>
          </div>

          <label
            class="field-label"
            for="amount"
          >
            Amount
          </label>

          <div class="amount-box">
            <span class="yen">¥</span>

            <input
              id="amount"
              type="number"
              inputmode="numeric"
              min="1"
              placeholder="Amount"
              required
            >
          </div>

          <label
            class="field-label"
            for="memo"
          >
            Memo
          </label>

          <textarea
            id="memo"
            placeholder="Optional note"
          ></textarea>

          <button
            id="submitButton"
            class="submit"
            type="submit"
          >
            Save
          </button>
        </form>

        <div
          id="last"
          class="last"
        ></div>
      </div>
    </section>

    <section
      id="summaryScreen"
      class="screen"
    >
      <div class="card">
        <h2 class="section-title">
          Monthly Snapshot
        </h2>

        <div class="summary-list">
          <div class="summary-item">
            <div class="summary-top">
              <div class="summary-label">
                Social
              </div>

              <div class="summary-right">
                <div
                  id="socialBudget"
                  class="summary-budget"
                >
                  ¥0
                </div>

                <div
                  id="socialBalance"
                  class="summary-balance plus"
                >
                  ¥0
                </div>
              </div>
            </div>

            <div
              id="socialRemaining"
              class="summary-value"
            >
              ¥0
            </div>
          </div>

          <div class="summary-item">
            <div class="summary-top">
              <div class="summary-label">
                Food
              </div>

              <div class="summary-right">
                <div
                  id="foodBudget"
                  class="summary-budget"
                >
                  ¥0
                </div>

                <div
                  id="foodBalance"
                  class="summary-balance plus"
                >
                  ¥0
                </div>
              </div>
            </div>

            <div
              id="foodRemaining"
              class="summary-value"
            >
              ¥0
            </div>
          </div>

          <div class="summary-item">
            <div class="summary-top">
              <div class="summary-label">
                Card Payment
              </div>
            </div>

            <div
              id="cardPayment"
              class="summary-value"
            >
              ¥0
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <nav class="tabs">
    <div class="tab-inner">
      <button
        id="inputTab"
        class="tab-button active"
        type="button"
      >
        Log
      </button>

      <button
        id="summaryTab"
        class="tab-button"
        type="button"
      >
        Summary
      </button>
    </div>
  </nav>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbxGe9RSpDwmY_crff6OGwvI4AxSQIxD7Abl7t7HBFLHhFI1bqTTPZLZD58Ab_Yu4cQ/exec';

    const getElement = function(id) {
      return document.getElementById(id);
    };

    const todayTextEl =
      getElement('todayText');

    const sheetNameEl =
      getElement('sheetName');

    const statusEl =
      getElement('status');

    const loadingEl =
      getElement('loading');

    const formEl =
      getElement('form');

    const categoryTabsEl =
      getElement('categoryTabs');

    const itemTabsEl =
      getElement('itemTabs');

    const amountEl =
      getElement('amount');

    const memoEl =
      getElement('memo');

    const submitButton =
      getElement('submitButton');

    const lastEl =
      getElement('last');

    let selectedCategory = '';
    let selectedItem = '';

    window.addEventListener(
      'load',
      function() {
        showStatus(
          'Loading data...',
          'info'
        );

        callApi('init')
          .then(handleInitialData)
          .catch(handleError);
      }
    );

    getElement('inputTab').addEventListener(
      'click',
      function() {
        switchScreen('input');
      }
    );

    getElement('summaryTab').addEventListener(
      'click',
      function() {
        switchScreen('summary');
      }
    );

    function switchScreen(name) {
      const isSummary =
        name === 'summary';

      getElement('inputScreen')
        .classList.toggle(
          'active',
          !isSummary
        );

      getElement('summaryScreen')
        .classList.toggle(
          'active',
          isSummary
        );

      getElement('inputTab')
        .classList.toggle(
          'active',
          !isSummary
        );

      getElement('summaryTab')
        .classList.toggle(
          'active',
          isSummary
        );

      if (isSummary) {
        callApi('summary')
          .then(function(data) {
            updateSummary(
              data.summary || {}
            );
          })
          .catch(handleError);
      }
    }

    function callApi(action, params) {
      params = params || {};

      return new Promise(
        function(resolve, reject) {
          const callbackName =
            'jsonpCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() * 100000
            );

          let finished = false;

          const script =
            document.createElement('script');

          const timeoutId =
            setTimeout(
              function() {
                finish(
                  new Error(
                    'Loading timed out.'
                  )
                );
              },
              15000
            );

          function cleanup() {
            clearTimeout(timeoutId);
            delete window[callbackName];

            if (script.parentNode) {
              script.parentNode
                .removeChild(script);
            }
          }

          function finish(error, data) {
            if (finished) {
              return;
            }

            finished = true;
            cleanup();

            if (error) {
              reject(error);
            } else {
              resolve(data);
            }
          }

          window[callbackName] =
            function(data) {
              if (
                !data ||
                data.success === false
              ) {
                finish(
                  new Error(
                    data && data.message
                      ? data.message
                      : 'API error.'
                  )
                );

                return;
              }

              finish(null, data);
            };

          const query = [
            'action=' +
              encodeURIComponent(action),
            'callback=' +
              encodeURIComponent(
                callbackName
              )
          ];

          Object.keys(params)
            .forEach(function(key) {
              query.push(
                encodeURIComponent(key) +
                '=' +
                encodeURIComponent(
                  params[key]
                )
              );
            });

          script.src =
            API_URL +
            '?' +
            query.join('&');

          script.onerror =
            function() {
              finish(
                new Error(
                  'Could not connect to the API.'
                )
              );
            };

          document.body
            .appendChild(script);
        }
      );
    }

    function handleInitialData(data) {
      todayTextEl.textContent =
        data.todayText || '';

      sheetNameEl.textContent =
        data.sheetName || '';

      renderTabs(
        categoryTabsEl,
        data.categories || [],
        'category'
      );

      renderTabs(
        itemTabsEl,
        data.items || [],
        'item'
      );

      updateSummary(
        data.summary || {}
      );

      loadingEl.style.display =
        'none';

      formEl.style.display =
        'block';

      hideStatus();
    }

    function renderTabs(
      container,
      options,
      type
    ) {
      container.innerHTML = '';

      if (!options.length) {
        const empty =
          document.createElement('div');

        empty.className =
          'empty-options';

        empty.textContent =
          type === 'category'
            ? 'C21の入力規則に選択肢がありません。'
            : 'D21の入力規則に選択肢がありません。';

        container.appendChild(empty);
        return;
      }

      options.forEach(
        function(value, index) {
          const button =
            document.createElement(
              'button'
            );

          button.type = 'button';
          button.className =
            'choice-button';

          button.textContent = value;
          button.dataset.value = value;

          if (index === 0) {
            button.classList.add(
              'active'
            );

            if (type === 'category') {
              selectedCategory = value;
            } else {
              selectedItem = value;
            }
          }

          button.addEventListener(
            'click',
            function() {
              const buttons =
                container.querySelectorAll(
                  '.choice-button'
                );

              buttons.forEach(
                function(target) {
                  target.classList.remove(
                    'active'
                  );
                }
              );

              button.classList.add(
                'active'
              );

              if (type === 'category') {
                selectedCategory = value;
              } else {
                selectedItem = value;
              }

              button.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest',
                inline: 'center'
              });
            }
          );

          container.appendChild(
            button
          );
        }
      );
    }

    formEl.addEventListener(
      'submit',
      function(event) {
        event.preventDefault();

        if (!selectedCategory) {
          showStatus(
            'Please select a Category.',
            'error'
          );

          return;
        }

        if (!selectedItem) {
          showStatus(
            'Please select an Item.',
            'error'
          );

          return;
        }

        if (
          !amountEl.value ||
          Number(amountEl.value) <= 0
        ) {
          showStatus(
            'Please enter an Amount.',
            'error'
          );

          amountEl.focus();
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent =
          'Saving...';

        showStatus(
          'Saving...',
          'info'
        );

        callApi('add', {
          category: selectedCategory,
          item: selectedItem,
          amount: amountEl.value,
          memo: memoEl.value
        })
          .then(handleSaved)
          .catch(handleError);
      }
    );

    function handleSaved(result) {
      showStatus(
        'Saved.',
        'success'
      );

      if (navigator.vibrate) {
        navigator.vibrate(80);
      }

      const saved =
        result.saved || {};

      lastEl.className =
        'last show';

      lastEl.textContent =
        'Last saved: ' +
        (result.sheetName || '') +
        ' / Row ' +
        (result.row || '') +
        ' — ' +
        (saved.date || '') +
        ' ' +
        (
          saved.category ||
          'Card Payment'
        ) +
        ' ' +
        (saved.item || '') +
        ' ¥' +
        Number(
          saved.amount || 0
        ).toLocaleString() +
        (
          saved.memo
            ? ' ' + saved.memo
            : ''
        );

      updateSummary(
        result.summary || {}
      );

      amountEl.value = '';
      memoEl.value = '';

      submitButton.disabled = false;
      submitButton.textContent =
        'Save';

      amountEl.focus();
    }

    function updateSummary(summary) {
      getElement(
        'socialBudget'
      ).textContent =
        formatYen(
          summary.socialBudget
        );

      getElement(
        'socialRemaining'
      ).textContent =
        formatYen(
          summary.socialRemaining
        );

      setBalance(
        getElement('socialBalance'),
        summary.socialBalance
      );

      getElement(
        'foodBudget'
      ).textContent =
        formatYen(
          summary.foodBudget
        );

      getElement(
        'foodRemaining'
      ).textContent =
        formatYen(
          summary.foodRemaining
        );

      setBalance(
        getElement('foodBalance'),
        summary.foodBalance
      );

      getElement(
        'cardPayment'
      ).textContent =
        formatYen(
          summary.cardPayment
        );
    }

    function setBalance(
      element,
      value
    ) {
      const number =
        Number(value || 0);

      element.textContent =
        (
          number < 0
            ? '-'
            : ''
        ) +
        formatYen(
          Math.abs(number)
        );

      element.classList.toggle(
        'minus',
        number < 0
      );

      element.classList.toggle(
        'plus',
        number >= 0
      );
    }

    function formatYen(value) {
      return (
        '¥' +
        Number(
          value || 0
        ).toLocaleString()
      );
    }

    function showStatus(
      message,
      type
    ) {
      statusEl.textContent =
        message;

      statusEl.className =
        'status show ' + type;
    }

    function hideStatus() {
      statusEl.textContent = '';
      statusEl.className =
        'status';
    }

    function handleError(error) {
      loadingEl.style.display =
        'none';

      showStatus(
        error.message ||
          String(error),
        'error'
      );

      submitButton.disabled = false;
      submitButton.textContent =
        'Save';
    }
  </script>
</body>
</html>
